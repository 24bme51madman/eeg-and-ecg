name: Build Kortex-Kare Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK 36 & Build Tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Configure Android SDK local.properties
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/android-36" "$ANDROID_HOME/build-tools/36.0.0" "$ANDROID_HOME/licenses"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install npm dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --legacy-peer-deps

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Report Gradle failure details
        if: failure()
        working-directory: android
        run: |
          if [ -f gradle-build.log ]; then
            echo "### Gradle Build Failure Tail" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ERR_MSG=$(grep -A 25 -E "FAILURE:|Execution failed for task|What went wrong:" gradle-build.log | head -n 30 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g' || true)
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 25 gradle-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            fi
            echo "::error title=Gradle Build Failed::$ERR_MSG"
          fi

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: android/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Kortex-Kare.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kortex-Kare.apk

      - name: Upload Kortex-Kare.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kortex-Kare-APK
          path: Kortex-Kare.apk
          retention-days: 30
