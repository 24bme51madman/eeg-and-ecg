name: Build Kortex-Kare Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK 36 & Build Tools
        run: |
          ANDROID_DIR="$HOME/android-sdk"
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ANDROID_DIR="$ANDROID_HOME"
          else
            mkdir -p "$ANDROID_DIR/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            rm -rf /tmp/cmdline-extract
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$ANDROID_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$ANDROID_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
          fi
          echo "ANDROID_HOME=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "$ANDROID_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_DIR/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_DIR/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_DIR" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle & sync Capacitor Android
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Kortex-Kare.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Kortex-Kare.apk

      - name: Upload Kortex-Kare.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kortex-Kare-APK
          path: Kortex-Kare.apk
          retention-days: 30
